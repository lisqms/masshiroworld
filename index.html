<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>PMS仮難易度表</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <meta name="bmstable" content="header.json" />
  
  <link rel="stylesheet" type="text/css" href="style/css/style_base.css" media="screen,print" />
  <link rel="stylesheet" type="text/css" href="style/css/style.css" media="screen,print" />
  
  <script src="https://code.jquery.com/jquery-2.0.2.min.js"></script>
  
  <style>
    body { background-color: #ffffff; color: #000000; font-family: sans-serif; margin: 10px; }
    .level-jump { margin-bottom: 10px; }
    .level-jump a { margin-right: 8px; display: inline-block; }
    .tableflame { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
  </style>
</head>
<body>

<div id="container">

  <div id="level-jump" class="level-jump"></div>

  <div class="tableflame">
    <table align="center" cellspacing="1" cellpadding="2" border="0" bgcolor="#000000" id="table_int" class="table-ir6"></table>
  </div>

</div>

<script type="text/javascript">
// TOTAL(+増加率)欄の文字色を使用するか
var ENABLE_TOTAL_RATE_COLOR = true;

$(document).ready(function(){
  $.getJSON($("meta[name=bmstable]").attr("content"), function(header){
    $.getJSON(header.data_url, function(information){
      // headerのsort有無で分岐
      if(header["level_order"]){
        makeBMSTable(information, header.symbol, header["level_order"]);
      } else {
        makeBMSTable(information, header.symbol);
      }
    });
  });
});

// レベル見出し用ID生成
function getLevelAnchorId(level, order, fallbackNumber, usedIds) {
  var number = fallbackNumber;
  if(order != "" && order != null){
    for(var i = 0; i < order.length; i++){
      if(order[i].toString() == level.toString()){
        number = i + 1;
        break;
      }
    }
  }
  while(usedIds["level-" + number]){
    number++;
  }
  usedIds["level-" + number] = true;
  return "level-" + number;
}

function hasValue(value) { return value != "" && value != null; }
function cellValue(value) { return value == null ? "" : value; }

// total / notesから1ノーツあたりのゲージ増加率を求める
function getTotalRate(item) {
  if(!hasValue(item.total) || !hasValue(item.notes)) { return NaN; }
  var total = Number(item.total);
  var notes = Number(item.notes);
  if(!isFinite(total) || !isFinite(notes) || notes <= 0) { return NaN; }
  return total / notes;
}

// TOTAL欄に表示する増加率を小数第3位へ丸める
function formatTotalRate(totalRate) {
  return Math.round((totalRate + 1e-12) * 1000) / 1000;
}

// totalとnotesからTOTAL欄の表示文字列を組み立てる
function getTotalDisplay(item, totalRate) {
  var total = cellValue(item.total);
  if(!hasValue(total)) { return ""; }
  if(!isFinite(totalRate)) { return total; }
  return total + " (" + formatTotalRate(totalRate) + "%/note)";
}

// total / notesから求めた値に応じてTOTAL欄の文字色クラスを返す
function getTotalRateClass(totalRate) {
  if(!ENABLE_TOTAL_RATE_COLOR || !isFinite(totalRate)) { return ""; }
  if(totalRate <= 0.1) { return "total-rate-red-bold"; }
  if(totalRate < 0.2) { return "total-rate-red"; }
  if(totalRate < 0.3) { return ""; }
  if(totalRate < 0.4) { return "total-rate-blue"; }
  return "total-rate-blue-bold";
}

function makeSeparatorRow(mark, level, count, sepId) {
  return "<tr class='tr_separate' id='" + sepId + "'><td colspan='16' align='center'><b>" + mark + level + " (" + count + "譜面)</b>  <a href='#container'>▲TOP</a></td></tr>";
}

function makeBMSTable(info, mark, order) {
  if(typeof order === 'undefined'){ order = null; }

  var x = "";
  var count = 0;
  var levelAnchorCount = 0;
  var usedLevelIds = {};
  var table = document.getElementById("table_int");

  if (!table) { return; }

  // ソート処理
  if(order != "" && order != null){
    var orderAry = [];
    for(var l = 0; l < order.length; l++){
      orderAry.push(order[l].toString());
    }
    for(var j = 0; j < info.length; j++){
      var index = orderAry.indexOf(info[j]["level"]);
      info[j]["_index"] = index;
    }
    info.sort(function(a,b){
      if(a["_index"] < b["_index"]){ return -1; }
      else if(a["_index"] > b["_index"]){ return 1; }
      else if( a["title"].toLowerCase() < b["title"].toLowerCase() ){ return -1; }
      else if( a["title"].toLowerCase() > b["title"].toLowerCase() ){ return 1; }
      else { return 0; }
    });
    for(var k=0; k < info.length; k++){
      delete info[k]["_index"];
    }
  } else {
    info.sort(function(a,b){
      var aLv = a["level"].toString();
      var bLv = b["level"].toString();
      if(isNaN(a["level"]) == false && isNaN(b["level"]) == false){
        return a["level"]-b["level"];
      } else if( aLv < bLv ){ return -1; }
      else if( aLv > bLv ){ return 1; }
      else if( a["title"].toLowerCase() < b["title"].toLowerCase() ){ return -1; }
      else if( a["title"].toLowerCase() > b["title"].toLowerCase() ){ return 1; }
      else { return 0; }
    });
  }

  var rows = [];
  var sepIndex = -1;
  var sepId = "";

  // 表のヘッダー行
  rows.push("<tr height='20' style='color:white;background-color:#666666'><td align='center'>LV</td><td align='center'>動画</td><td align='center'>譜面</td><td colspan='6' align='center'>IR</td><td align='center'>タイトル + LR2IR (Archive)</td><td align='center'>本体</td><td align='center'>差分</td><td align='center'>Notes</td><td align='center'>TOTAL(+増加率)</td><td align='center'>memo</td><td align='center'>コメント</td></tr>");

  for (var i = 0; i < info.length; i++) {
    var item = info[i];

    // 難易度ごとの区切り行
    if (x != item.level) {
      if (sepIndex >= 0) {
        rows[sepIndex] = makeSeparatorRow(mark, x, count, sepId);
      }
      levelAnchorCount++;
      sepId = getLevelAnchorId(item.level, order, levelAnchorCount, usedLevelIds);
      sepIndex = rows.length;
      rows.push(makeSeparatorRow(mark, item.level, 0, sepId));
      count = 0;
      x = item.level;
    }

    // 楽曲データ行
    var rowClass = "tr_normal";
    if(hasValue(item.state)) {
      rowClass = "state" + item.state;
    }

    var row = [];
    row.push("<tr class='" + rowClass + "'>");
    row.push("<td width='3%'>" + mark + x + "</td>");

    // 動画
    if(hasValue(item.video1)){
      row.push("<td width='1.2%' align='center'><a href='http://www.nicovideo.jp/watch/sm" + item.video1 + "' target='_blank'><img src='style/nico.gif' border='0' alt='ニコニコ' /></a></td>");
    } else if(hasValue(item.video2)){
      row.push("<td width='1.2%' align='center'><a href='http://www.youtube.com/watch?v=" + item.video2 + "' target='_blank'><img src='style/youtube.gif' border='0' alt='Youtube' /></a></td>");
    } else if(hasValue(item.video3)){
      row.push("<td width='1.2%' align='center'><a href='http://vimeo.com/" + item.video3 + "' target='_blank'><img src='style/vimeo.gif' border='0' alt='vimeo' /></a></td>");
    } else {
      row.push("<td width='1.2%'></td>");
    }

    // 譜面画像・各種IR
    row.push("<td width='1.2%' align='center'><a href='https://bms-score-viewer.pages.dev/view?md5=" + item.md5 + "' target='_blank'>♪</a></td>");
    row.push("<td width='1.2%' align='center'><a href='https://mocha-repository.info/song.php?sha256=" + item.sha256 + "' target='_blank'><img src='style/mochair_logo.gif' border='0' alt='Mocha' /></a></td>");
    row.push("<td width='1.2%' align='center'><a href='https://www.gaftalk.com/minir/#/viewer/song/" + item.sha256 + "/0' target='_blank'><img src='style/minir_logo.gif' border='0' /></a></td>");
    row.push("<td width='1.2%' align='center'><a href='https://bms-ir.org/new/song?songmd5=" + item.md5 + "' target='_blank'><img src='style/bmsir_logo.gif' border='0' /></a></td>");
    row.push("<td width='1.2%' align='center'><a href='https://rianir.link/pages/ranking/ranking.php?sha256=" + item.sha256 + "' target='_blank'><img src='style/rianir_logo.gif' border='0' /></a></td>");
    row.push("<td width='1.2%' align='center'><a href='https://ir.stellabms.xyz/charts/" + item.md5 + "' target='_blank'><img src='style/stellaverseir_logo.gif' border='0' /></a></td>");

    // タイトル
    row.push("<td width='15%'><a href='https://lr2ir.com/charts/" + item.md5 + "' target='_blank'>" + cellValue(item.title) + "</a></td>");

    // アーティスト
    var astr = "";
    if(hasValue(item.url)) {
      astr = "<a href='" + item.url + "'>" + (hasValue(item.artist) ? item.artist : item.url) + "</a>";
    } else if(hasValue(item.artist)) {
      astr = item.artist;
    }
    if(hasValue(item.url_pack)) {
      astr += "<br />(<a href='" + item.url_pack + "'>" + (hasValue(item.name_pack) ? item.name_pack : item.url_pack) + "</a>)";
    } else if(hasValue(item.name_pack)) {
      astr += "<br />(" + item.name_pack + ")";
    }
    row.push("<td width='12%'>" + astr + "</td>");

    // 差分
    if(hasValue(item.url_diff)) {
      row.push("<td width='12%'><a href='" + item.url_diff + "'>" + (hasValue(item.name_diff) ? item.name_diff : item.url_diff) + "</a></td>");
    } else {
      row.push("<td width='12%'>" + cellValue(item.name_diff) + "</td>");
    }

    // Notes / TOTAL / memo / コメント
    row.push("<td width='3%'>" + cellValue(item.notes) + "</td>");
    var totalRate = getTotalRate(item);
    var totalRateClass = getTotalRateClass(totalRate);
    var totalClassAttribute = totalRateClass ? " class='" + totalRateClass + "'" : "";
    row.push("<td width='5%'" + totalClassAttribute + ">" + getTotalDisplay(item, totalRate) + "</td>");
    row.push("<td width='3%'>" + cellValue(item.memo) + "</td>");
    row.push("<td width='12%'>" + cellValue(item.comment) + "</td>");

    row.push("</tr>");
    rows.push(row.join(""));
    count++;
  }

  if (sepIndex >= 0) {
    rows[sepIndex] = makeSeparatorRow(mark, x, count, sepId);
  }

  table.innerHTML = rows.join("");

  // レベルジャンプリンク生成
  var levelJump = $("#level-jump");
  if (levelJump.length) {
    levelJump.empty();
    $("#table_int .tr_separate[id]").each(function() {
      var label = $("b", this).first().text().replace(/\s*\(\d+譜面\).*$/, "");
      $("<a></a>").attr("href", "#" + this.id).text(label).appendTo(levelJump);
    });
  }
}
</script>

</body>
</html>
