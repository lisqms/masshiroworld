<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Loading...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="bmstable" content="insane_pmsdatabase_header.json">

  <style>
    body { font-family: sans-serif; margin: 10px; font-size: 13px; background: #fff; color: #333; }
    a { color: #0056b3; text-decoration: none; }
    #error-display { display: none; background: #fee; border: 1px solid #fcc; color: #900; padding: 8px; margin-bottom: 10px; }
    
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th, td { border: 1px solid #ccc; padding: 2px; word-break: break-all; }

    .header-row { position: sticky; top: 0; background: #333; color: #fff; text-align: center; }
    .tr_separate { background: #eee; font-weight: bold; text-align: center; }
    .tr_normal:hover { background: #f0f0f0; }

    .total-rate-red-bold { color: #d00; font-weight: bold; }
    .total-rate-red { color: #d00; }
    .total-rate-blue { color: #00f; }
    .total-rate-blue-bold { color: #00f; font-weight: bold; }

    /* ダークモード */
    @media (prefers-color-scheme: dark) {
      body { background: #121212; color: #eee; }
      a { color: #6ea8fe; }
      #search-box { background: #222; color: #fff; border: 1px solid #555; }
      #search-status { color: #aaa !important; }
      th, td { border-color: #444; }
      .header-row { background: #222; }
      .tr_separate { background: #282828; color: #fff; }
      .tr_normal:hover { background: #222; }
      .total-rate-red-bold, .total-rate-red { color: #ea868f; }
      .total-rate-blue-bold, .total-rate-blue { color: #6ea8fe; }
    }
  </style>
</head>
<body>

<div id="container">
  <div style="margin-bottom: 10px;"><a href="../">← 戻る</a></div>
  <div id="error-display"></div>
  
  <div style="margin-bottom: 10px;">
    <input type="text" id="search-box" placeholder="検索（2文字以上入力）..." style="width: 250px;">
    <span id="search-status" style="font-size: 12px; color: #666; margin-left: 8px;"></span>
  </div>

  <table id="table_int"></table>
  <div style="margin-top: 10px;"><a href="../">← 戻る</a></div>
</div>

<script>
let searchableRows = [], sepRowMap = [];

function showError(msg) {
  const err = document.getElementById("error-display");
  err.textContent = "";
  
  const h3 = document.createElement("h3");
  h3.textContent = "⚠️ エラー";
  err.appendChild(h3);
  
  const p = document.createElement("p");
  p.textContent = msg;
  err.appendChild(p);

  err.style.display = "block";
  document.title = "エラー";
}

document.addEventListener("DOMContentLoaded", async () => {
  const metaTag = document.querySelector('meta[name="bmstable"]');
  if (!metaTag) return showError('<meta name="bmstable"> がありません。');

  try {
    const header = await (await fetch(metaTag.getAttribute("content"), { cache: "no-store" })).json();
    if (!header.data_url) return showError("data_url が指定されていません。");

    document.title = header.name || "BMS Database";
    const info = await (await fetch(header.data_url, { cache: "no-store" })).json();

    makeBMSTable(info, header.symbol || "", header.level_order || []);
    setupSearch();
  } catch {
    showError("データの読み込みに失敗しました。");
  }
});

function getTotalDisplay(item) {
  const total = Number(item.total), notes = Number(item.notes);
  if (!total || !notes || isNaN(total) || isNaN(notes)) return item.total ?? "";
  
  const rate = total / notes;
  const cls = rate <= 0.10 ? "total-rate-red-bold" :
              rate < 0.20  ? "total-rate-red" :
              rate < 0.40  ? "total-rate-blue" : "total-rate-blue-bold";

  return `<span class="${cls}">${total} (${rate.toFixed(3)}%/note)</span>`;
}

function getVideoLink(item) {
  const links = [];
  if (item.video1) links.push(`<a href='http://www.nicovideo.jp/watch/sm${item.video1}' target='_blank'>ニコ</a>`);
  if (item.video2) links.push(`<a href='http://www.youtube.com/watch?v=${item.video2}' target='_blank'>YT</a>`);
  if (item.video3) links.push(`<a href='http://vimeo.com/${item.video3}' target='_blank'>Vimeo</a>`);
  return links.join(" ");
}

function makeBMSTable(info, mark, order) {
  const table = document.getElementById("table_int");
  if (!table) return;

  const orderMap = Object.fromEntries(order.map((lvl, i) => [lvl, i]));

  info.sort((a, b) => {
    const aIdx = orderMap[a.level] ?? 99999;
    const bIdx = orderMap[b.level] ?? 99999;
    return aIdx !== bIdx ? aIdx - bIdx : (a.title || "").localeCompare(b.title || "");
  });
  
  const rows = [
    `<tr class='header-row'><td>LV</td><td>動画</td><td>譜面</td><td colspan='6'>IR</td><td>タイトル + Mocha</td><td>本体</td><td>差分</td><td>Notes</td><td>TOTAL(+増加率)</td><td>memo</td><td>コメント</td></tr>`
  ];
  
  let currentLevel = null, levelCount = 0, lastSepIdx = -1;

  for (const item of info) {
    const itemLevel = item.level ?? "";

    if (currentLevel !== itemLevel) {
      if (lastSepIdx !== -1) {
        rows[lastSepIdx] = `<tr class='tr_separate'><td colspan='16'><b>${mark}${currentLevel} (${levelCount}譜面)</b> <a href='#container' style='font-size:12px;'>▲TOP</a></td></tr>`;
      }
      currentLevel = itemLevel;
      levelCount = 0;
      lastSepIdx = rows.length;
      rows.push("");
    }
    levelCount++;

    const artist = item.artist || item.url || "";
    const pack = item.name_pack || item.url_pack || "";
    const diff = item.name_diff || item.url_diff || "";

    rows.push(`<tr class='tr_normal'>
      <td style='text-align:center;'>${mark}${currentLevel}</td>
      <td style='text-align:center;'>${getVideoLink(item)}</td>
      <td style='text-align:center;'><a href='https://bms-score-viewer.pages.dev/view?md5=${item.md5}' target='_blank'>♪</a></td>
      <td style='text-align:center;'><a href='https://lr2ir.com/charts/${item.md5}' target='_blank'>LR2IR</a></td>
      <td style='text-align:center;'><a href='https://www.gaftalk.com/minir/#/viewer/song/${item.sha256}/0' target='_blank'>MinIR</a></td>
      <td style='text-align:center;'><a href='https://bms-ir.org/new/song?songmd5=${item.md5}' target='_blank'>BMS-IR</a></td>
      <td style='text-align:center;'><a href='https://rianir.link/pages/ranking/ranking.php?sha256=${item.sha256}' target='_blank'>RianIR</a></td>
      <td style='text-align:center;'><a href='https://ir.stellabms.xyz/charts/${item.md5}' target='_blank'>STELLA</a></td>
      <td style='text-align:center;'><a href='https://kaleidir.com/charts/${item.sha256}' target='_blank'>Kaleid</a></td>
      <td><a href='https://mocha-repository.info/song.php?sha256=${item.sha256}' target='_blank'>${item.title ?? ""}</a></td>
      <td>${item.url ? `<a href='${item.url}'>${artist}</a>` : artist}${pack ? `<br />(${item.url_pack ? `<a href='${item.url_pack}'>${pack}</a>` : pack})` : ""}</td>
      <td>${item.url_diff ? `<a href='${item.url_diff}'>${diff}</a>` : diff}</td>
      <td style='text-align:center;'>${item.notes ?? ""}</td>
      <td>${getTotalDisplay(item)}</td>
      <td>${item.memo ?? ""}</td>
      <td>${item.comment ?? ""}</td>
    </tr>`);
  }

  if (lastSepIdx !== -1) {
    rows[lastSepIdx] = `<tr class='tr_separate'><td colspan='16'><b>${mark}${currentLevel} (${levelCount}譜面)</b> <a href='#container' style='font-size:12px;'>▲TOP</a></td></tr>`;
  }

  table.innerHTML = rows.join("");

  searchableRows = [];
  sepRowMap = [];
  let currentSep = null;

  for (const row of table.rows) {
    if (row.classList.contains("tr_separate")) {
      currentSep = { element: row, matchCount: 0 };
      sepRowMap.push(currentSep);
    } else if (row.classList.contains("tr_normal")) {
      searchableRows.push({
        element: row,
        text: row.textContent.toLowerCase(),
        parentSep: currentSep
      });
    }
  }
}

function setupSearch() {
  const searchBox = document.getElementById("search-box");
  const statusEl = document.getElementById("search-status");
  let timer = null;

  searchBox.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      const query = searchBox.value.toLowerCase().trim();

      if (query.length < 2) {
        statusEl.textContent = query.length === 1 ? "2文字以上入力してください" : "";
        searchableRows.forEach(r => r.element.hidden = false);
        sepRowMap.forEach(s => s.element.hidden = false);
        return;
      }

      let totalMatches = 0;
      sepRowMap.forEach(s => s.matchCount = 0);

      searchableRows.forEach(item => {
        const isMatch = item.text.includes(query);
        item.element.hidden = !isMatch;
        if (isMatch) {
          totalMatches++;
          if (item.parentSep) item.parentSep.matchCount++;
        }
      });

      sepRowMap.forEach(s => {
        s.element.hidden = (s.matchCount === 0);
      });

      statusEl.textContent = `${totalMatches} 件表示中`;
    }, 200);
  });
}
</script>

</body>
</html>
